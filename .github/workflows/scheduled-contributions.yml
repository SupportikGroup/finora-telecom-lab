    - cron: "40 18 22 8 *"    # Aug22 2026-08-22 21:40 x10
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide commit count
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            "7 6 30 7 *") COUNT=6 ;;
            "15 7 30 7 *") COUNT=8 ;;
            "10 12 30 7 *") COUNT=8 ;;
            "15 8 30 7 *") COUNT=6 ;;
            "15 10 31 7 *") COUNT=6 ;;
            "48 5 31 7 *") COUNT=6 ;;
            "5 7 1 8 *") COUNT=8 ;;
            "32 16 1 8 *") COUNT=1 ;;
            "8 14 1 8 *") COUNT=10 ;;
            "11 12 2 8 *") COUNT=1 ;;
            "18 6 2 8 *") COUNT=1 ;;
            "0 16 3 8 *") COUNT=6 ;;
            "44 16 3 8 *") COUNT=4 ;;
            "1 7 3 8 *") COUNT=1 ;;
            "42 19 12 8 *") COUNT=10 ;;
            "46 19 12 8 *") COUNT=7 ;;
            "49 19 12 8 *") COUNT=3 ;;
            "50 19 12 8 *") COUNT=5 ;;
            "55 19 12 8 *") COUNT=8 ;;
            "59 19 12 8 *") COUNT=8 ;;
            "57 3 13 8 *") COUNT=4 ;;
            "25 10 13 8 *") COUNT=9 ;;
