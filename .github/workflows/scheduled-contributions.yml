name: Scheduled contributions
on:
  schedule:
    - cron: "7 6 30 7 *"    # Jul30 2026-07-30 09:07 x6
    - cron: "15 7 30 7 *"    # Jul30 2026-07-30 10:15 x8
    - cron: "10 12 30 7 *"    # Jul30 2026-07-30 15:10 x8
    - cron: "15 8 30 7 *"    # Jul30 2026-07-30 11:15 x6
    - cron: "15 10 31 7 *"    # Jul31 2026-07-31 13:15 x6
    - cron: "48 5 31 7 *"    # Jul31 2026-07-31 08:48 x6
    - cron: "5 7 1 8 *"    # Aug1 2026-08-01 10:05 x8
    - cron: "32 16 1 8 *"    # Aug1 2026-08-01 19:32 x1
    - cron: "8 14 1 8 *"    # Aug1 2026-08-01 17:08 x10
    - cron: "11 12 2 8 *"    # Aug2 Sun 1 2026-08-02 15:11
    - cron: "18 6 2 8 *"    # Aug2 Sun 2 2026-08-02 09:18
    - cron: "0 16 3 8 *"    # Aug3 2026-08-03 19:00 x6
    - cron: "44 16 3 8 *"    # Aug3 2026-08-03 19:44 x4
    - cron: "1 7 3 8 *"    # Aug3 2026-08-03 10:01 x1
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide commit count
        id: plan
        run: |
          case "${{ github.event.schedule }}" in
            "7 6 30 7 *") COUNT=6 ;;
            "15 7 30 7 *") COUNT=8 ;;
            "10 12 30 7 *") COUNT=8 ;;
            "15 8 30 7 *") COUNT=6 ;;
            "15 10 31 7 *") COUNT=6 ;;
            "48 5 31 7 *") COUNT=6 ;;
            "5 7 1 8 *") COUNT=8 ;;
            "32 16 1 8 *") COUNT=1 ;;
            "8 14 1 8 *") COUNT=10 ;;
            "11 12 2 8 *") COUNT=1 ;;
            "18 6 2 8 *") COUNT=1 ;;
            "0 16 3 8 *") COUNT=6 ;;
            "44 16 3 8 *") COUNT=4 ;;
            "1 7 3 8 *") COUNT=1 ;;
            *) COUNT=1 ;;
          esac
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Create scheduled commits
        env:
          COUNT: ${{ steps.plan.outputs.count }}
        run: |
          git config user.name "Finora Groups"
          git config user.email "support@finoragroups.com"
          for i in $(seq 1 "$COUNT"); do
            TS="$(date -u +"%Y-%m-%d %H:%M UTC")"
            FILE="scheduled/log-${TS//[: ]/-}-$i.txt"
            mkdir -p scheduled
            { echo "Scheduled contribution"; echo "Timestamp: $TS"; echo "Item $i of $COUNT"; } > "$FILE"
            git add "$FILE"
            git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "Scheduled update $i/$COUNT ($TS)"
          done
          git push
